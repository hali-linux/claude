# WebTerm 설정 파일 (/etc/webterm/webterm.conf)
#
# 웹 서버(webterm 사용자)와 root 헬퍼가 함께 읽는 파일입니다.
# 비밀 값은 넣지 마세요. 변경 후에는 두 서비스를 재시작합니다:
#   systemctl restart webterm-helper webterm
# (webterm 재시작 시 열려 있던 터미널은 모두 종료됩니다)

[web]
# httpd 가 프록시하는 내부 주소. 외부에 직접 노출하지 마세요.
listen_host = 127.0.0.1
listen_port = 8022

# 브라우저 제목과 로그인 화면에 표시되는 이름
title = WebTerm

# 로그인 화면 하단 안내문 (여러 줄은 줄 앞에 공백을 넣어 이어 씁니다)
login_notice = 인가된 사용자만 접속할 수 있습니다. 모든 접속 기록은 서버에 저장됩니다.

# X-Forwarded-For / X-Forwarded-Proto 를 신뢰할 프록시 주소 (httpd)
trusted_proxies = 127.0.0.1, ::1

# WebSocket/POST 요청에 허용할 Origin. 비워 두면 요청의 Host 헤더를 기준으로
# 같은 출처만 허용합니다. 예) allowed_origins = https://shell.example.com
allowed_origins =

cookie_name = webterm_session
# /webterm/ 같은 하위 경로에 배치했다면 그 경로로 바꾸세요.
cookie_path = /
# HTTPS 뒤에서 운영할 때는 반드시 yes
cookie_secure = yes

# 키보드 입력이 없을 때 로그인 세션(과 모든 터미널)을 종료할 시간(초). 0 = 사용 안 함
session_idle_timeout = 3600
# 로그인 세션 최대 유지 시간(초)
session_max_lifetime = 43200
# 브라우저 연결이 끊긴 뒤에도 터미널을 유지할 시간(초). 새로고침/재접속 시 이어서 사용
detach_timeout = 900
# 로그인 세션당 최대 터미널(탭) 수
max_terminals = 6
# 사용자당 동시 로그인 세션 수 (초과 시 가장 오래된 세션 종료)
max_sessions_per_user = 5
# 재접속 시 다시 보여 줄 터미널 출력 버퍼 크기(바이트)
scrollback_bytes = 262144
# 업로드 파일 최대 크기(바이트, 기본 1GiB). httpd LimitRequestBody 에도 반영됩니다.
max_upload_bytes = 1073741824

# 로그인 실패 제한: login_failure_window 초 안에 login_max_failures 번 실패하면
# 해당 IP 와 사용자 이름을 login_lockout 초 동안 차단
login_max_failures = 5
login_failure_window = 600
login_lockout = 900

# 웹 서버 자체 접근 로그 (httpd 로그가 있으므로 기본 끔)
access_log = no

[helper]
socket = /run/webterm/helper.sock
socket_group = webterm
client_user = webterm
# /etc/pam.d/webterm
pam_service = webterm

# 이 그룹 중 하나에 속한 사용자만 로그인할 수 있습니다.
#   usermod -aG webterm-users <사용자>
# 비워 두면 로그인 셸이 있는 모든 계정이 로그인할 수 있습니다(권장하지 않음).
allowed_groups = webterm-users
denied_users = root
# UID 0 계정 로그인 허용 여부 (권장: no, 필요하면 일반 계정으로 로그인 후 sudo 사용)
allow_root = no

# 헬퍼가 발급하는 토큰 유효 시간(초). session_max_lifetime 이상이어야 합니다.
token_lifetime = 43200
term = xterm-256color
# 새 셸의 LANG. 비워 두면 서버 기본값(/etc/locale.conf)을 따릅니다.
# 한글 입력/출력이 깨지면(로케일이 C/POSIX 인 경우) UTF-8 로케일을 지정하세요.
# 예) lang = ko_KR.UTF-8   (dnf install glibc-langpack-ko)  또는  lang = C.UTF-8
lang =
