# ─────────────────────────────────────────────────────────────────────────────
# SPOE: HAProxy ↔ modsec-spoa  (≈ ALB 에 AWS WAF Web ACL 연결)
#
# HAProxy가 요청(헤더 + 본문 앞 64KB)을 에이전트로 보내고, 에이전트가 판정을
# txn.waf.* 변수로 돌려줍니다. 차단 여부는 haproxy.cfg 의 WAF 블록이 결정합니다.
#   txn.waf.action   allow | block | redirect | error
#   txn.waf.status   규칙이 요청한 HTTP 상태
#   txn.waf.rule_id  차단한 규칙 ID (예: 949110, 10101)
#   txn.waf.rules    일치한 규칙 ID 목록
#   txn.waf.labels   attack-sqli, KnownBadInputs:... (≈ AWS WAF labels)
#   txn.waf.score    CRS 이상 점수
#   txn.waf.body     inspected | skipped | partial | none
#   txn.waf.error    SPOE 오류 코드 (3 = 프레임 초과)
#   txn.waf.process_time  검사 시간(ms)
# ─────────────────────────────────────────────────────────────────────────────
[modsecurity]
spoe-agent modsecurity-agent
    groups              waf-full waf-nobody
    option var-prefix   waf
    option set-on-error error
    option set-process-time process_time
    register-var-names  action status rule_id rules labels score body redirect
    timeout hello       2s
    timeout idle        30s
    timeout processing  1s
    use-backend         spoe_modsecurity
    log                 global
    # 성공한 검사는 HAProxy 접근 로그(waf_* 필드)에 이미 남으므로 SPOE 오류만 기록
    option dontlog-normal

# 요청 전체(헤더 + 본문). 본문은 앞 64KB만 보냅니다(haproxy.cfg 의 body_oversize 와 같은 값).
spoe-message modsec-request
    args id=unique-id src_ip=src src_port=src_port dst_ip=dst dst_port=dst_port method=method path=pathq version=req.ver headers=req.hdrs_bin mode=var(txn.waf_mode) country=var(txn.country) body_size=req.body_size body=req.body,bytes(0,65536)

# 본문이 검사 한도를 넘는 업로드: 헤더·URI·쿼리만 검사 (본문은 보내지 않음)
spoe-message modsec-request-nobody
    args id=unique-id src_ip=src src_port=src_port dst_ip=dst dst_port=dst_port method=method path=pathq version=req.ver headers=req.hdrs_bin mode=var(txn.waf_mode) country=var(txn.country) body_size=req.body_size body_skipped=bool(true)

spoe-group waf-full
    messages modsec-request

spoe-group waf-nobody
    messages modsec-request-nobody
