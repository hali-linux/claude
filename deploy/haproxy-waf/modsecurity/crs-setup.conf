# ─────────────────────────────────────────────────────────────────────────────
# OWASP CRS 설정  (≈ AWS WAF 관리형 규칙 그룹 설정)
#
# CRS는 "이상 점수(anomaly scoring)" 방식입니다. 각 규칙은 차단하지 않고 점수만
# 더하며, 요청 점수가 임계값 이상이면 규칙 949110이 차단합니다.
# 전체 옵션: /etc/modsec-spoa/crs/crs-setup.conf.example
# ─────────────────────────────────────────────────────────────────────────────

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# 편집증 수준(Paranoia Level). 1 = AWS Core rule set과 비슷한 기본값(오탐 최소).
# 2 이상은 탐지율이 올라가지만 오탐 튜닝이 필요합니다. 먼저 count 모드로 운영해 보세요.
SecAction \
    "id:900000,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:tx.blocking_paranoia_level=1"

# 차단 임계값. 5 = CRITICAL 규칙 하나만 걸려도 차단(CRS 기본값).
SecAction \
    "id:900110,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# 헤더 단계(phase 1)에서 이미 임계값을 넘으면 본문을 기다리지 않고 차단합니다.
SecAction \
    "id:900120,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:tx.early_blocking=1"

# 허용 HTTP 메서드. 이 앱은 REST API에서 PUT/PATCH/DELETE를 사용합니다.
SecAction \
    "id:900200,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# 허용 Content-Type. 이 앱은 JSON(API)과 multipart(사진 업로드)만 받습니다.
SecAction \
    "id:900220,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |application/json|'"

# 응답은 HAProxy가 에이전트로 보내지 않으므로 응답 규칙을 건너뜁니다.
SecAction \
    "id:900500,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:tx.crs_skip_response_analysis=1"

# CRS가 "설정 없이 배포됨"(901001)으로 모든 요청을 막지 않도록 하는 필수 표식
SecAction \
    "id:900990,phase:1,pass,t:none,nolog,tag:'OWASP_CRS',\
    setvar:tx.crs_setup_version=4250"
