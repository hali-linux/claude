# ─────────────────────────────────────────────────────────────────────────────
# ModSecurity v3 엔진 설정 (modsecurity.conf-recommended 기반)
#
# HAProxy가 요청 헤더와 본문 앞부분(기본 64KB)만 에이전트로 보냅니다.
# AWS WAF가 ALB 요청 본문의 앞부분만 검사하는 것과 같은 구조입니다.
# 응답은 검사하지 않습니다(ALB에 연결된 AWS WAF도 응답을 검사하지 않음).
# ─────────────────────────────────────────────────────────────────────────────

# On: 차단 판정을 만든다. 실제 차단 여부(block/count)는 HAProxy의
# /etc/haproxy/waf/waf-mode.map 에서 호스트별로 정합니다.
SecRuleEngine On

# ── 요청 본문 ────────────────────────────────────────────────────────────────
SecRequestBodyAccess On

# XML / JSON 본문 파서 지정
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/(?:[a-z0-9.+-]+\+)?json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# HAProxy가 보내는 본문은 최대 64KB이므로 이 한도에 걸리지 않습니다.
SecRequestBodyLimit 131072
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction ProcessPartial
SecRequestBodyJsonDepthLimit 512
SecArgumentsLimit 1000

SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count',severity:2,tag:'label:ModSecurityCore:TooManyArguments'"

# 본문 파싱 실패 = 파서 우회 시도일 수 있으므로 차단
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2,tag:'label:ModSecurityCore:BodyParseError'"

SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,\
    msg:'Multipart request body failed strict validation: PE %{REQBODY_PROCESSOR_ERROR}, BQ %{MULTIPART_BOUNDARY_QUOTED}, BW %{MULTIPART_BOUNDARY_WHITESPACE}, DB %{MULTIPART_DATA_BEFORE}, DA %{MULTIPART_DATA_AFTER}, HF %{MULTIPART_HEADER_FOLDING}, LF %{MULTIPART_LF_LINE}, SM %{MULTIPART_MISSING_SEMICOLON}, IQ %{MULTIPART_INVALID_QUOTING}, IP %{MULTIPART_INVALID_PART}, IH %{MULTIPART_INVALID_HEADER_FOLDING}, FL %{MULTIPART_FILE_LIMIT_EXCEEDED}',\
    tag:'label:ModSecurityCore:MultipartStrictError'"

SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.',tag:'label:ModSecurityCore:MultipartUnmatchedBoundary'"

SecRule TX:/^MSC_/ "!@streq 0" \
    "id:200005,phase:2,t:none,log,deny,msg:'ModSecurity internal error flagged: %{MATCHED_VAR_NAME}',tag:'label:ModSecurityCore:InternalError'"

# 정규식 폭주(ReDoS) 방지
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

# ── 응답: 검사하지 않음 ──────────────────────────────────────────────────────
SecResponseBodyAccess Off

# ── 파일 / 로그 ──────────────────────────────────────────────────────────────
SecTmpDir /var/lib/modsec-spoa/tmp
SecDataDir /var/lib/modsec-spoa/data

# ModSecurity 감사 로그는 끕니다. 대신 modsec-spoa가 AWS WAF 로그 형식의 JSON을
# /var/log/modsec-spoa/waf.log 에 남기며, 쿠키·인증 헤더·비밀번호 값은 마스킹합니다.
# (감사 로그를 켜면 세션 쿠키와 로그인 요청 본문이 그대로 기록됩니다.)
SecAuditEngine Off

SecArgumentSeparator &
SecCookieFormat 0
SecStatusEngine Off
