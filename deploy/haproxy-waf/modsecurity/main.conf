# ─────────────────────────────────────────────────────────────────────────────
# modsec-spoa 규칙 진입점  (≈ AWS WAF Web ACL)
#
# Include 순서가 곧 규칙 우선순위(Priority)입니다.
#   1. modsecurity.conf          엔진 설정 (본문 파서, 한도, 로그)
#   2. crs-setup.conf            관리형 규칙 그룹(OWASP CRS) 설정
#   3. rules.d/before-crs/*.conf 사용자 규칙 + CRS 예외(CRS보다 먼저 평가)
#   4. crs/rules/*.conf          OWASP Core Rule Set (≈ AWSManagedRulesCommonRuleSet 등)
#   5. rules.d/after-crs/*.conf  CRS 규칙 제거/수정 (SecRuleRemoveById 등)
#
# 경로는 이 파일이 있는 디렉터리(/etc/modsec-spoa) 기준 상대경로입니다.
# 변경 후:  modsec-spoa -t -rules /etc/modsec-spoa/main.conf && systemctl reload modsec-spoa
# ─────────────────────────────────────────────────────────────────────────────
Include modsecurity.conf
Include crs-setup.conf
Include rules.d/before-crs/*.conf
Include crs/rules/*.conf
Include rules.d/after-crs/*.conf
