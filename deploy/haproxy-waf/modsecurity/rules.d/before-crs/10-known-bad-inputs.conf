# ─────────────────────────────────────────────────────────────────────────────
# Known bad inputs  (≈ AWSManagedRulesKnownBadInputsRuleSet)
#
# CRS에서 편집증 수준 2 이상에만 있는 패턴 중, 오탐이 거의 없고 실제 공격에
# 자주 쓰이는 것을 PL1에서 바로 차단합니다. 점수 방식이 아닌 즉시 차단(deny)이며
# label:<이름> 태그가 HAProxy 로그(waf_labels)와 WAF 로그(labels)에 남습니다.
# 규칙 ID 범위: 10000-10099
# ─────────────────────────────────────────────────────────────────────────────

# Java 역직렬화 페이로드(직렬화 매직 0xACED0005의 base64 / gzip+base64 형태)
#   AWS: JavaDeserializationRCE_HEADER / _BODY / _QUERYSTRING / _URIPATH
SecRule REQUEST_LINE|ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_HEADERS|!REQUEST_HEADERS:Cookie "@rx (?:rO0ABX|rO0ABQ|KztAAU|Cs7QAF)" \
    "id:10001,phase:2,deny,status:403,log,t:none,\
    msg:'Java deserialization payload',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:CRITICAL,tag:'attack-rce',tag:'label:KnownBadInputs:JavaDeserializationRCE'"

# Spring4Shell (CVE-2022-22965) 클래스 로더 조작
SecRule ARGS_NAMES|ARGS|REQUEST_BODY "@rx (?i)class\.(?:module\.)?classloader\." \
    "id:10002,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,\
    msg:'Spring4Shell class loader manipulation',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
    severity:CRITICAL,tag:'attack-rce',tag:'label:KnownBadInputs:Spring4Shell'"

# 존재하지 않는 관리/진단 경로 탐색(스캐너)   AWS: ExploitablePaths_URIPATH
SecRule REQUEST_FILENAME "@pmFromFile known-bad-paths.data" \
    "id:10003,phase:1,deny,status:403,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Request for a known exploitable path',\
    logdata:'Matched Data: %{MATCHED_VAR}',\
    severity:ERROR,tag:'attack-reputation-scanner',tag:'label:KnownBadInputs:ExploitablePaths'"

# Host 헤더가 localhost인 외부 요청   AWS: Host_localhost_HEADER
SecRule REQUEST_HEADERS:Host "@rx ^(?:localhost|127(?:\.\d{1,3}){3}|\[?::1\]?|0\.0\.0\.0)(?::\d+)?$" \
    "id:10004,phase:1,deny,status:403,log,t:none,t:lowercase,\
    msg:'Host header is localhost',\
    logdata:'Matched Data: %{MATCHED_VAR}',\
    severity:ERROR,tag:'attack-protocol',tag:'label:KnownBadInputs:Host_localhost'"
