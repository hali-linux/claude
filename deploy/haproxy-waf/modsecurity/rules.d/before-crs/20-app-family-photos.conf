# ─────────────────────────────────────────────────────────────────────────────
# 앱 전용 규칙: 우리 가족 사진 (Next.js 16)   (≈ Web ACL의 사용자 정의 규칙)
#
#  - 앱이 쓰지 않는 Next.js 기능으로 들어오는 요청은 공격 표면이므로 차단
#  - 비밀번호 필드는 사용자가 어떤 문자든 쓸 수 있으므로 CRS 검사에서 제외
# 규칙 ID 범위: 10100-10199
# ─────────────────────────────────────────────────────────────────────────────

# Next.js 미들웨어 우회 (CVE-2025-29927). 외부에서 이 헤더를 보낼 이유가 없습니다.
SecRule &REQUEST_HEADERS:x-middleware-subrequest "@gt 0" \
    "id:10101,phase:1,deny,status:403,log,t:none,\
    msg:'Next.js middleware bypass attempt (x-middleware-subrequest)',\
    severity:CRITICAL,tag:'attack-protocol',tag:'label:NextJS:MiddlewareBypass'"

# 이 앱은 Server Actions를 쓰지 않습니다(REST API만 사용).
# Server Action 호출(RSC Flight 페이로드)은 원격 코드 실행 취약점(CVE-2025-55182 등)의
# 진입점이므로 차단합니다. Server Actions를 도입하면 이 규칙을 제거하세요.
SecRule &REQUEST_HEADERS:Next-Action "@gt 0" \
    "id:10102,phase:1,deny,status:403,log,t:none,\
    msg:'Next.js Server Action request but the app has no Server Actions',\
    severity:CRITICAL,tag:'attack-rce',tag:'label:NextJS:ServerActionNotUsed'"

# 이 앱은 next/image를 쓰지 않습니다(인증 이미지 API 사용). 이미지 최적화
# 엔드포인트는 SSRF/DoS 공격 표면이므로 차단합니다.
SecRule REQUEST_FILENAME "@beginsWith /_next/image" \
    "id:10103,phase:1,deny,status:403,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Next.js image optimizer is not used by this app',\
    severity:WARNING,tag:'attack-protocol',tag:'label:NextJS:ImageOptimizerNotUsed'"

# 비밀번호: 로그인·가입·비밀번호 변경 요청의 비밀번호 값은 CRS로 검사하지 않습니다.
# (예: 비밀번호에 ' OR 1=1 같은 문자열이 들어가도 로그인할 수 있어야 함)
# 앱은 Prisma 파라미터 바인딩과 bcrypt만 사용하므로 이 값이 쿼리/HTML로 가지 않습니다.
SecRule REQUEST_FILENAME "@rx ^/api/auth/(?:login|register|password)$" \
    "id:10110,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newPassword"

# ── 오탐 예외 추가 예시 ─────────────────────────────────────────────────────
# WAF 로그(/var/log/modsec-spoa/waf.log)에서 오탐 규칙 ID와 변수명을 확인한 뒤
# 가능한 한 좁게(경로 + 변수) 예외를 둡니다.
#
# 예) 사진 설명(description)에서 942100 오탐이 날 때:
# SecRule REQUEST_FILENAME "@rx ^/api/photos/[a-z0-9]+$" \
#     "id:10150,phase:1,pass,nolog,t:none,\
#     ctl:ruleRemoveTargetById=942100;ARGS:json.description"
