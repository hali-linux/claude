# ─────────────────────────────────────────────────────────────────────────────
# CRS 로드 이후 적용하는 규칙 제거/수정  (≈ AWS WAF "Rule action override")
#
# 이 파일은 CRS 규칙 파일들 다음에 로드되므로 SecRuleRemoveById,
# SecRuleUpdateTargetById 등으로 특정 CRS 규칙을 전역적으로 끄거나 변경할 수 있습니다.
# 경로별 예외는 before-crs/20-app-family-photos.conf 의 ctl: 방식을 쓰세요.
#
# 예) 규칙 하나를 완전히 끄기 (AWS: 규칙을 Count로 override 하는 것과 유사)
# SecRuleRemoveById 920350
#
# 예) 특정 쿠키를 모든 CRS 규칙 검사에서 제외
# SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:fp_family"
# ─────────────────────────────────────────────────────────────────────────────
