# HAProxy 로그 수신 (UDP 127.0.0.1:514, haproxy.cfg 의 "log 127.0.0.1:514 ... local2")
#   /var/log/haproxy/access.log  접근 로그, 한 줄에 JSON 하나 (≈ ALB access log)
#   /var/log/haproxy/admin.log   시작/중지, 대상 상태 변화, SPOE 오류 등
# @@MODULE_IMUDP@@
template(name="HaproxyJson" type="string" string="%msg:2:$%\n")
ruleset(name="haproxy") {
    if $syslogseverity == 6 then {
        action(type="omfile" file="/var/log/haproxy/access.log" template="HaproxyJson")
    } else {
        action(type="omfile" file="/var/log/haproxy/admin.log")
    }
    stop
}
input(type="imudp" address="127.0.0.1" port="514" ruleset="haproxy")
