# TrafficGate 대기열 서버 커널 튜닝 (선택)
# 적용: sudo cp 90-trafficgate.conf /etc/sysctl.d/ && sudo sysctl --system
#
# 대기자는 수 초마다 폴링하므로 짧은 연결이 매우 많이 생긴다.

# 수신 대기열(백로그) 확대 — 순간적인 접속 폭주 시 SYN 유실 방지
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.core.netdev_max_backlog = 16384

# nginx → TrafficGate 프록시 연결용 로컬 포트 범위 확대 및 TIME_WAIT 재사용
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# 시스템 전체 파일 디스크립터 한도
fs.file-max = 2097152
