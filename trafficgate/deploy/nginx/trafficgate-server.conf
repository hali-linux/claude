# =====================================================================
#  대기열 전용 도메인 예시 (JS 에이전트 연동용)
#  예) https://wait.example.com/trafficgate.js 를 각 웹사이트에서 불러오는 구성
#  위치: /etc/nginx/conf.d/trafficgate.conf
#
#  SELinux: setsebool -P httpd_can_network_connect 1
# =====================================================================

upstream trafficgate {
    server 127.0.0.1:8800;
    # Redis 클러스터 모드의 다른 노드들
    # server 10.0.0.12:8800;
    keepalive 256;
}

# 관리 콘솔(8801)은 기본적으로 로컬 전용입니다. 원격으로 열어야 한다면
# 아래 블록을 사용하고 반드시 접근 IP 를 제한하세요.
#
# server {
#     listen 8443 ssl http2;
#     server_name wait.example.com;
#     ssl_certificate     /etc/pki/tls/certs/wait.example.com.crt;
#     ssl_certificate_key /etc/pki/tls/private/wait.example.com.key;
#     allow 10.0.0.0/8;     # 사내망
#     deny  all;
#     location / {
#         proxy_pass http://127.0.0.1:8801;
#         proxy_set_header Host $host;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

server {
    listen 80;
    server_name wait.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wait.example.com;

    ssl_certificate     /etc/pki/tls/certs/wait.example.com.crt;
    ssl_certificate_key /etc/pki/tls/private/wait.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1h;

    # 대기자 폴링은 연결이 잦으므로 keepalive 를 길게
    keepalive_timeout 75s;
    keepalive_requests 10000;

    access_log /var/log/nginx/trafficgate.access.log combined buffer=64k flush=5s;

    location / {
        proxy_pass http://trafficgate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # 에이전트 스크립트는 짧게 캐시
    location = /trafficgate.js {
        proxy_pass http://trafficgate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 5m;
    }
}
