# =====================================================================
#  nginx 게이트 연동 예시 — 애플리케이션 코드 수정 없이 대기열 적용
#  위치: /etc/nginx/conf.d/<사이트>.conf
#
#  동작:
#   1) 보호 경로 요청마다 auth_request 로 TrafficGate 에 통과 쿠키(tg_<세그먼트>)를 확인
#   2) 쿠키가 없으면(401) 원래 URL 그대로 대기 화면을 보여줌
#   3) 차례가 되면 TrafficGate 가 HttpOnly 통과 쿠키를 발급하고 같은 URL 을 다시 불러옴
#
#  필요 모듈: ngx_http_auth_request_module (Rocky 9 의 nginx 패키지에 포함)
#    확인: nginx -V 2>&1 | grep -o http_auth_request_module
#  SELinux: nginx 가 TrafficGate(8800)로 프록시하려면
#    setsebool -P httpd_can_network_connect 1
# =====================================================================

upstream trafficgate {
    server 127.0.0.1:8800;
    # 여러 TrafficGate 노드(Redis 클러스터 모드)라면 모두 나열
    # server 10.0.0.11:8800;
    # server 10.0.0.12:8800;
    keepalive 128;
}

upstream backend {
    server 127.0.0.1:8080;   # 실제 웹 애플리케이션 (예: Tomcat/Spring)
    keepalive 64;
}

server {
    listen 80;
    server_name www.example.com;
    # listen 443 ssl http2; ssl_certificate ...; ssl_certificate_key ...;

    # ---- TrafficGate: 대기 화면/에이전트/대기열 API (gate_base_path 와 같아야 함) ----
    #  ^~ 는 아래 정적 파일 정규식(.js 등)보다 이 위치가 우선하도록 한다.
    location ^~ /__tg/ {
        proxy_pass http://trafficgate/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        access_log off;
    }

    # ---- 통과 쿠키 검사 (내부 서브요청) ----
    #  ?segment=ID 를 빼면 관리 콘솔에서 지정한 세그먼트의 URL 패턴으로 자동 매칭
    location = /__tg_auth {
        internal;
        proxy_pass http://trafficgate/gate/auth;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        access_log off;
    }

    # ---- 대기 화면 (원래 URL 에서 그대로 표시) ----
    location @tg_wait {
        proxy_pass http://trafficgate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-TrafficGate-Wait 1;
        # 세그먼트를 고정하려면: proxy_set_header X-TrafficGate-Segment event;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- (선택) TrafficGate 장애 시 대기열 없이 통과 (fail-open) ----
    location @tg_bypass {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 정적 파일은 보호하지 않음 (대기 화면 성능/트래픽 절약) ----
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ---- 보호할 경로 ----
    location / {
        auth_request /__tg_auth;
        error_page 401 = @tg_wait;
        # TrafficGate 응답 실패(연결 불가 등) 시 통과시키려면 주석 해제 (fail-open)
        # error_page 500 502 503 504 = @tg_bypass;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
